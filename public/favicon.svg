<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Gradient background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />
  
  <!-- Inner subtle highlight border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
  
  <!-- Modern Bold 'K' -->
  <text 
    x="50%" 
    y="52%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="38" 
    font-weight="900" 
    fill="#ffffff"
    filter="url(#shadow)">
    K
  </text>
</svg>
